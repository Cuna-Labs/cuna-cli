name: Review npm preview release

# This workflow used to end in an unconditional `exit 1` that printed five
# blocker names. That was honest about the state of the repository but it was
# not a gate: it could not distinguish a release that should be refused from one
# that should be allowed, so nothing about it could ever pass or be tested.
#
# Each of those five names is now a check that reads live state and fails closed
# with the same identifier when the authority is genuinely absent:
#
#   RELEASE_REVIEW_ENVIRONMENT_ADMIN_BYPASS_ENABLED
#     -> scripts/verify-release-review-authority.mjs, against the live environment
#   ACTUAL_ENVIRONMENT_APPROVAL_EVENT_NOT_OBSERVABLE_BY_WORKFLOW_TOKEN
#     -> scripts/verify-release-approval-event.mjs, against this run's approvals
#   CANDIDATE_BOUND_OBSERVATION_COHORT_NOT_AVAILABLE
#     -> scripts/verify-observation-cohort.mjs, against a distribution-observation run
#   CANONICAL_CONTRACT_AUTHORITY_ARTIFACT_NOT_AVAILABLE
#   CANDIDATE_RELEASE_CONTRACT_AUTHORITY_UNRESOLVED
#     -> scripts/verify-contract-authority.mjs, against packaging/contract-authority.json
#
# The lease is minted only after all of them pass, and it is attested by this
# workflow so that release.yml can verify who produced it.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact candidate SemVer
        required: true
        type: string
      source_commit:
        description: Exact protected-main source commit
        required: true
        type: string
      candidate_run_id:
        description: Successful main CI run containing release-review-candidate
        required: true
        type: string
      candidate_sha256:
        description: Exact candidate npm tarball SHA-256
        required: true
        type: string
      candidate_envelope_sha256:
        description: Exact release-envelope SHA-256
        required: true
        type: string
      observation_run_id:
        description: Successful distribution-observation run containing observation-cohort
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-review-${{ inputs.source_commit }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  review:
    name: protected-candidate-review-fail-closed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release-review-npm-preview
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
      - name: Verify declared review authority against read-only GitHub state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-review-authority.mjs
      - name: Observe the exact protected-environment approval that released this job
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-release-approval-event.mjs
      - name: Bind dispatch to protected main and successful candidate producer
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          VERSION: ${{ inputs.version }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        shell: bash
        run: |
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          CANDIDATE_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event,.head_branch,.path] | join(" ")')"
          test "$CANDIDATE_STATE" = "completed success ${SOURCE_COMMIT} push main .github/workflows/ci.yml"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-review-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - name: Verify exact candidate bytes and provenance
        env:
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_ENVELOPE_SHA256: ${{ inputs.candidate_envelope_sha256 }}
        shell: bash
        run: |
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ENVELOPE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
          node scripts/verify-release-distributions.mjs --root . --evidence admitted/release-artifacts --distributions admitted/release-artifacts/distributions
          test "$(sha256sum admitted/release-artifacts/release-envelope.json | cut -d' ' -f1)" = "$CANDIDATE_ENVELOPE_SHA256"
          TARBALL_FILE="$(node -p "require('./admitted/release-artifacts/release-envelope.json').tarball.file")"
          [[ "$TARBALL_FILE" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          test "$(sha256sum "admitted/release-artifacts/$TARBALL_FILE" | cut -d' ' -f1)" = "$CANDIDATE_SHA256"
      - name: Verify GitHub provenance of exact candidate bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh attestation verify admitted/release-artifacts/*.tgz
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml"
      - name: Bind the observation cohort to this candidate's own producing run
        env:
          GH_TOKEN: ${{ github.token }}
          OBSERVATION_RUN_ID: ${{ inputs.observation_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          [[ "$OBSERVATION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          OBSERVATION_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${OBSERVATION_RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event,.head_branch,.path] | join(" ")')"
          test "$OBSERVATION_STATE" = "completed success ${SOURCE_COMMIT} workflow_dispatch main .github/workflows/distribution-observation.yml"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: observation-cohort
          run-id: ${{ inputs.observation_run_id }}
          github-token: ${{ github.token }}
          path: admitted/observation
      - name: Require a complete candidate-bound observation cohort
        run: >-
          node scripts/verify-observation-cohort.mjs
          --candidate-run-id "${{ inputs.candidate_run_id }}"
          --observation-run-id "${{ inputs.observation_run_id }}"
      # Every other step here reads this repository, so `github.token` reaches
      # everything it needs. This one reads a DIFFERENT repository -- the
      # producer of the contract, which is private -- and a workflow token is
      # scoped to the repository it runs in and nowhere else. It therefore
      # received 404 for a commit that exists, and the refusal said so in the
      # only honest way available: absent, or present and invisible, because
      # GitHub answers both alike.
      #
      # The token below resolves that ambiguity by being able to see it. It is
      # fine-grained, holds Contents:Read on Cuna-Labs/infra-proxy-mvp and
      # nothing else, and lives on this protected environment rather than on the
      # repository, so it is presentable only by a review job a human has
      # already approved. Read-only is the whole requirement: this step observes
      # an approval, it never records one.
      - name: Require the producer-approved canonical contract authority
        env:
          GITHUB_TOKEN: ${{ secrets.CONTRACT_PRODUCER_TOKEN }}
        shell: bash
        run: |
          # An unset secret expands to the empty string, which would reach the
          # script as a malformed token and refuse with a message about token
          # shape. Name the actual missing thing instead.
          if [ -z "${GITHUB_TOKEN}" ]; then
            echo "CANONICAL_CONTRACT_AUTHORITY_ARTIFACT_NOT_AVAILABLE: the release-review-npm-preview environment carries no CONTRACT_PRODUCER_TOKEN, so the producer's approval is unobserved rather than absent." >&2
            exit 1
          fi
          node scripts/verify-contract-authority.mjs
      - name: Require the candidate itself to carry a resolved contract authority
        shell: bash
        run: |
          node - <<'NODE'
          const inputs = require('./admitted/release-artifacts/release-inputs.json');
          if (inputs.contractSet?.releaseAuthority === 'UNRESOLVED_BLOCKING') {
            throw new Error('CANDIDATE_RELEASE_CONTRACT_AUTHORITY_UNRESOLVED: the admitted candidate was built without a canonical contract authority.');
          }
          NODE
      - name: Mint the single-use approval lease from verified evidence only
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-release-approval-lease.mjs
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v3.2.0
        with:
          subject-path: approval/release-approval-lease.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-approval-lease
          path: |
            approval/release-approval-lease.json
            approval/release-approval-expectation.json
            evidence/release-approval-event.json
            evidence/observation-cohort-verification.json
          if-no-files-found: error
          retention-days: 30
      # A review that refuses still established things worth keeping -- above
      # all, WHO approved, which is the one fact no later reader can reconstruct
      # and the one this repository has never been able to observe. The step
      # above does not run when an earlier check fails, so without this the
      # receipts for the checks that did pass would exist only in a run log.
      #
      # Scoped to `evidence/` deliberately: the lease is written to `approval/`,
      # so a refused review can never emit a partial lease under any name.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-review-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: warn
          retention-days: 30
