name: Release npm preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release-review SemVer to publish
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit from main CI
        required: true
        type: string
      candidate_run_id:
        description: Successful main CI run containing release-review-candidate
        required: true
        type: string
      candidate_sha256:
        description: Exact release-review npm tarball SHA-256
        required: true
        type: string
      candidate_envelope_sha256:
        description: Exact immutable release-envelope v2 SHA-256
        required: true
        type: string
      approval_run_id:
        description: Successful protected release-review run containing the signed approval lease
        required: true
        type: string
      approval_lease_sha256:
        description: Exact signed release-approval lease SHA-256
        required: true
        type: string
      approval_expectation_sha256:
        description: Exact release-approval expectation SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-preview-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: immutable-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: read
      contents: write
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Require source commit to remain protected main HEAD
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_ENVELOPE_SHA256: ${{ inputs.candidate_envelope_sha256 }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          APPROVAL_LEASE_SHA256: ${{ inputs.approval_lease_sha256 }}
          APPROVAL_EXPECTATION_SHA256: ${{ inputs.approval_expectation_sha256 }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ENVELOPE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$APPROVAL_LEASE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$APPROVAL_EXPECTATION_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify selected CI run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          RUN_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event,.head_branch,.path] | join(" ")')"
          test "$RUN_STATE" = "completed success ${SOURCE_COMMIT} push main .github/workflows/ci.yml"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-review-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - name: Verify candidate, admission, and dispatch binding
        shell: bash
        run: |
          node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const envelopeFile = 'admitted/release-artifacts/release-envelope.json';
          const envelopeBytes = fs.readFileSync(envelopeFile);
          const envelope = JSON.parse(envelopeBytes);
          const admission = JSON.parse(fs.readFileSync('admitted/evidence/admission.json'));
          const envelopeSha256 = crypto.createHash('sha256').update(envelopeBytes).digest('hex');
          if (envelope.schemaVersion !== 2 || admission.schemaVersion !== 3) process.exit(1);
          if (envelope.version !== process.env.VERSION || envelope.sourceCommit !== process.env.SOURCE_COMMIT || envelope.tarball.sha256 !== process.env.CANDIDATE_SHA256) process.exit(1);
          if (envelopeSha256 !== process.env.CANDIDATE_ENVELOPE_SHA256 || admission.releaseEnvelopeSha256 !== envelopeSha256) process.exit(1);
          if (admission.candidateSha256 !== envelope.tarball.sha256 || admission.sourceCommit !== envelope.sourceCommit || admission.releaseInputsSha256 !== envelope.releaseInputs.sha256) process.exit(1);
          if (JSON.stringify(admission.identities) !== JSON.stringify(envelope.identities)) process.exit(1);
          // This asked the CI admission to be release authorization. It never
          // can be, and that is on purpose: `verify-release-admission.mjs`
          // writes PLATFORM_MATRIX_VERIFIED_NOT_RELEASE_AUTHORIZED with no
          // branch that could write anything else, and a test holds it there by
          // name -- "complete platform receipts are never elevated to release
          // authorization". The value this line demanded has never existed in
          // the emitter, in any commit. So the condition was unsatisfiable, and
          // an unsatisfiable gate refuses every release alike: it cannot tell a
          // candidate that should publish from one that should not.
          //
          // Authorization in this repository is the approval lease, and the
          // steps below take it apart properly: its digest against the dispatch
          // input, its semantic binding to this exact candidate, an attestation
          // proving release-review.yml and nothing else produced it, and a
          // one-use nonce consumed atomically so the same lease cannot publish
          // twice. The admission's own limitations list says NO_RELEASE_APPROVAL
          // _LEASE -- it is describing what it is not, and the lease is what it
          // is not.
          //
          // The check is inverted rather than deleted. The admission is still
          // required to be exactly the non-authorizing verdict its emitter
          // produces, so if that verdict is ever changed -- to authorize, or to
          // anything else -- publication stops here until someone has looked at
          // why. The digest bindings above are untouched: this admission must
          // still be the one belonging to this candidate.
          if (admission.decision !== 'PLATFORM_MATRIX_VERIFIED_NOT_RELEASE_AUTHORIZED' || admission.releaseEligible !== false) {
            throw new Error('Publication blocked: the admission verdict is not the one its emitter produces, so the platform evidence is unrecognised.');
          }
          NODE
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_ENVELOPE_SHA256: ${{ inputs.candidate_envelope_sha256 }}
      - name: Require canonical contract authority before publication
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const inputs = JSON.parse(fs.readFileSync('admitted/release-artifacts/release-inputs.json'));
          if (inputs.contractSet.releaseAuthority === 'UNRESOLVED_BLOCKING') {
            throw new Error('Publication blocked: the release envelope is not bound to the canonical Cuna API contract authority.');
          }
          NODE
      - name: Verify GitHub build provenance for the exact tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh attestation verify admitted/release-artifacts/*.tgz
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/ci.yml"
      - name: Verify protected release-review run identity
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_RUN_ID: ${{ inputs.approval_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          APPROVAL_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${APPROVAL_RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event,.head_branch,.path] | join(" ")')"
          test "$APPROVAL_STATE" = "completed success ${SOURCE_COMMIT} workflow_dispatch main .github/workflows/release-review.yml"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-approval-lease
          run-id: ${{ inputs.approval_run_id }}
          github-token: ${{ github.token }}
          # release-review.yml uploads four files under two directories, so the
          # artifact carries `approval/` and `evidence/` at its own root.
          # Extracting it into `admitted/approval` therefore produced
          # `admitted/approval/approval/release-approval-lease.json`, and every
          # reader below -- these two digest checks, the lease verifier, the
          # attestation check, the nonce consumer and publish-npm-preview.mjs --
          # looks for `admitted/approval/release-approval-lease.json`. The first
          # sha256sum failed with "No such file or directory".
          #
          # Extracting into `admitted` lets the artifact's own prefix put the
          # files exactly where those readers already look, so the paths stop
          # depending on a directory this workflow invented. The lease's
          # `evidence/` lands beside the candidate's, which share no filename,
          # and the admission is read several steps above this download.
          path: admitted
      - name: Verify approval lease identity and semantic binding
        env:
          APPROVAL_LEASE_SHA256: ${{ inputs.approval_lease_sha256 }}
          APPROVAL_EXPECTATION_SHA256: ${{ inputs.approval_expectation_sha256 }}
        shell: bash
        run: |
          test "$(sha256sum admitted/approval/release-approval-lease.json | cut -d' ' -f1)" = "$APPROVAL_LEASE_SHA256"
          test "$(sha256sum admitted/approval/release-approval-expectation.json | cut -d' ' -f1)" = "$APPROVAL_EXPECTATION_SHA256"
          node scripts/verify-release-approval-lease.mjs \
            --root admitted/approval \
            --lease release-approval-lease.json \
            --expectation release-approval-expectation.json
      - name: Verify cryptographic provenance of the exact approval lease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh attestation verify admitted/approval/release-approval-lease.json
          --repo "$GITHUB_REPOSITORY"
          --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release-review.yml"
      - name: Atomically consume the one-use approval nonce
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          cp packaging/release-approval-consumption-authority.json admitted/approval/release-approval-consumption-authority.json
          node scripts/consume-release-approval-nonce.mjs \
            --root admitted/approval \
            --lease release-approval-lease.json \
            --expectation release-approval-expectation.json \
            --authority release-approval-consumption-authority.json \
            > admitted/approval/release-approval-consumption.json
          node -e 'const r=require("./admitted/approval/release-approval-consumption.json"); if(r.status!=="CONSUMED") process.exit(1)'
      - name: Require exact registry version to be absent
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/verify-registry-version-absent.mjs --envelope admitted/release-artifacts/release-envelope.json --version "$VERSION"

  publish-preview:
    name: trusted-publisher-preview
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-review-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - run: node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-approval-lease
          run-id: ${{ inputs.approval_run_id }}
          github-token: ${{ github.token }}
          # Same correction as the preflight job. publish-npm-preview.mjs builds
          # its lease and expectation paths from `admitted/approval`, which is
          # where the artifact's own prefix puts them once it is extracted here
          # rather than one directory deeper.
          path: admitted
      # NODE_AUTH_TOKEN exists here for one publication and should not outlive it.
      #
      # npm's trusted publishing is configured on a package's own settings page,
      # and @cuna_labs/cli has no such page because it has never been published.
      # The registry has no way to record that this workflow may publish a
      # package that does not exist, so the first publication cannot present an
      # OIDC identity and must present a credential instead. npm documents this
      # -- publish once with a token, then configure the trusted publisher --
      # and npm/cli#8544 tracks closing the gap.
      #
      # This changes how the job authenticates to the registry and nothing else.
      # Every control still runs: the protected-environment approval, the
      # attested lease, the one-use nonce consumed against a protected tag, the
      # digest checks on the exact bytes, and --provenance, which derives from
      # the Actions OIDC identity rather than from this token. The secret is
      # scoped to the npm environment, so only a job a human has already
      # approved can read it.
      #
      # AFTER 0.1.0 IS PUBLISHED: configure the trusted publisher on the package
      # (Cuna-Labs/cuna-cli, release.yml, environment npm), then delete both the
      # NPM_TOKEN secret and these two lines. Publication returns to OIDC, and an
      # empty NODE_AUTH_TOKEN is exactly what npm needs to attempt it.
      - name: Revalidate fresh approval and publish exact admitted bytes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_SOURCE_COMMIT: ${{ inputs.source_commit }}
          APPROVAL_LEASE_SHA256: ${{ inputs.approval_lease_sha256 }}
          APPROVAL_EXPECTATION_SHA256: ${{ inputs.approval_expectation_sha256 }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: node scripts/publish-npm-preview.mjs
      - name: Verify downloaded registry bytes and preview tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          node scripts/verify-postpublish.mjs
          --envelope admitted/release-artifacts/release-envelope.json
          --version "$VERSION"
          --tag preview
          --receipt admitted/evidence/npm-preview-receipt.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-preview-verification-${{ inputs.version }}
          path: admitted/evidence/
          if-no-files-found: warn
          retention-days: 30
