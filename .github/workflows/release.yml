name: Release npm preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact admitted SemVer to publish
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit from main CI
        required: true
        type: string
      candidate_run_id:
        description: Successful main CI run containing admitted-release-candidate
        required: true
        type: string
      candidate_sha256:
        description: Exact admitted npm tarball SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-preview-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: immutable-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Require source commit to remain protected main HEAD
        shell: bash
        run: |
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "${{ inputs.source_commit }}"
          test "$(git rev-parse origin/main)" = "${{ inputs.source_commit }}"
      - name: Verify selected CI run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          RUN_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event] | join(" ")')"
          test "$RUN_STATE" = "completed success ${SOURCE_COMMIT} push"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admitted-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - name: Verify candidate, admission, and dispatch binding
        shell: bash
        run: |
          node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          const envelope = JSON.parse(fs.readFileSync('admitted/release-artifacts/release-envelope.json'));
          const admission = JSON.parse(fs.readFileSync('admitted/evidence/admission.json'));
          if (envelope.version !== process.env.VERSION || envelope.sourceCommit !== process.env.SOURCE_COMMIT || envelope.tarball.sha256 !== process.env.CANDIDATE_SHA256) process.exit(1);
          if (admission.candidateSha256 !== envelope.tarball.sha256 || admission.sourceCommit !== envelope.sourceCommit) process.exit(1);
          NODE
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
      - name: Verify GitHub build provenance for the exact tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh attestation verify admitted/release-artifacts/*.tgz --repo "$GITHUB_REPOSITORY"
      - run: node scripts/verify-registry-version-absent.mjs --envelope admitted/release-artifacts/release-envelope.json --version "${{ inputs.version }}"

  publish-preview:
    name: trusted-publisher-preview
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: admitted-release-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - run: node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
      - name: Publish exact admitted bytes with short-lived OIDC identity
        run: >-
          npm publish
          "admitted/release-artifacts/$(node -p "require('./admitted/release-artifacts/release-envelope.json').tarball.file")"
          --provenance
          --access public
          --registry https://registry.npmjs.org/
          --tag preview
      - name: Verify downloaded registry bytes and preview tag
        run: >-
          node scripts/verify-postpublish.mjs
          --envelope admitted/release-artifacts/release-envelope.json
          --version "${{ inputs.version }}"
          --tag preview
          --receipt admitted/evidence/npm-preview-receipt.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-preview-verification-${{ inputs.version }}
          path: admitted/evidence/
          if-no-files-found: warn
          retention-days: 30
