name: Release npm preview

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact release-review SemVer to publish
        required: true
        type: string
      source_commit:
        description: Exact 40-character source commit from main CI
        required: true
        type: string
      candidate_run_id:
        description: Successful main CI run containing release-review-candidate
        required: true
        type: string
      candidate_sha256:
        description: Exact release-review npm tarball SHA-256
        required: true
        type: string
      candidate_envelope_sha256:
        description: Exact immutable release-envelope v2 SHA-256
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: npm-preview-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  preflight:
    name: immutable-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      source_commit: ${{ steps.validate.outputs.source_commit }}
      version: ${{ steps.validate.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - name: Require source commit to remain protected main HEAD
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_ENVELOPE_SHA256: ${{ inputs.candidate_envelope_sha256 }}
        shell: bash
        run: |
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$CANDIDATE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$CANDIDATE_ENVELOPE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          git fetch --no-tags origin main
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(git rev-parse origin/main)" = "$SOURCE_COMMIT"
          echo "source_commit=$SOURCE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify selected CI run identity
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.candidate_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        shell: bash
        run: |
          RUN_STATE="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq '[.status,.conclusion,.head_sha,.event] | join(" ")')"
          test "$RUN_STATE" = "completed success ${SOURCE_COMMIT} push"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-review-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - name: Verify candidate, admission, and dispatch binding
        shell: bash
        run: |
          node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
          node - <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const envelopeFile = 'admitted/release-artifacts/release-envelope.json';
          const envelopeBytes = fs.readFileSync(envelopeFile);
          const envelope = JSON.parse(envelopeBytes);
          const admission = JSON.parse(fs.readFileSync('admitted/evidence/admission.json'));
          const envelopeSha256 = crypto.createHash('sha256').update(envelopeBytes).digest('hex');
          if (envelope.schemaVersion !== 2 || admission.schemaVersion !== 3) process.exit(1);
          if (envelope.version !== process.env.VERSION || envelope.sourceCommit !== process.env.SOURCE_COMMIT || envelope.tarball.sha256 !== process.env.CANDIDATE_SHA256) process.exit(1);
          if (envelopeSha256 !== process.env.CANDIDATE_ENVELOPE_SHA256 || admission.releaseEnvelopeSha256 !== envelopeSha256) process.exit(1);
          if (admission.candidateSha256 !== envelope.tarball.sha256 || admission.sourceCommit !== envelope.sourceCommit || admission.releaseInputsSha256 !== envelope.releaseInputs.sha256) process.exit(1);
          if (JSON.stringify(admission.identities) !== JSON.stringify(envelope.identities)) process.exit(1);
          if (admission.decision !== 'CANDIDATE_ADMITTED_FOR_EXTERNAL_RELEASE_REVIEW' || admission.releaseEligible !== true) {
            throw new Error('Publication blocked: installed-platform evidence is not authenticated semantic release authorization.');
          }
          NODE
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_SHA256: ${{ inputs.candidate_sha256 }}
          CANDIDATE_ENVELOPE_SHA256: ${{ inputs.candidate_envelope_sha256 }}
      - name: Require canonical contract authority before publication
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const inputs = JSON.parse(fs.readFileSync('admitted/release-artifacts/release-inputs.json'));
          if (inputs.contractSet.releaseAuthority === 'UNRESOLVED_BLOCKING') {
            throw new Error('Publication blocked: the release envelope is not bound to the canonical Runa API contract authority.');
          }
          NODE
      - name: Verify GitHub build provenance for the exact tarball
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh attestation verify admitted/release-artifacts/*.tgz --repo "$GITHUB_REPOSITORY"
      - name: Require exact registry version to be absent
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/verify-registry-version-absent.mjs --envelope admitted/release-artifacts/release-envelope.json --version "$VERSION"

  publish-preview:
    name: trusted-publisher-preview
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.preflight.outputs.source_commit }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.17.1
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-review-candidate
          run-id: ${{ inputs.candidate_run_id }}
          github-token: ${{ github.token }}
          path: admitted
      - run: node scripts/verify-release-envelope.mjs --root admitted/release-artifacts
      - name: Publish exact admitted bytes with short-lived OIDC identity
        shell: bash
        run: |
          TARBALL_FILE="$(node -p "require('./admitted/release-artifacts/release-envelope.json').tarball.file")"
          [[ "$TARBALL_FILE" =~ ^[A-Za-z0-9._-]+\.tgz$ ]]
          npm publish "admitted/release-artifacts/$TARBALL_FILE" \
            --provenance \
            --access public \
            --registry https://registry.npmjs.org/ \
            --tag preview
      - name: Verify downloaded registry bytes and preview tag
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          node scripts/verify-postpublish.mjs
          --envelope admitted/release-artifacts/release-envelope.json
          --version "$VERSION"
          --tag preview
          --receipt admitted/evidence/npm-preview-receipt.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-preview-verification-${{ inputs.version }}
          path: admitted/evidence/
          if-no-files-found: warn
          retention-days: 30
