[package]
name = "cuna-native-bridge"
version = "0.1.0"
description = "Cuna native credential and browser bridge"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
zeroize = "=1.9.0"

[build-dependencies]
winresource = "=0.1.31"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Credentials",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"

[package.metadata.winresource]
CompanyName = "Cuna Labs"
FileDescription = "Cuna Native Credential and Browser Bridge"
FileVersion = "0.1.0.0"
InternalName = "cuna-native-bridge"
LegalCopyright = "Copyright 2026 Cuna Labs"
OriginalFilename = "cuna-native-bridge.exe"
ProductName = "Cuna CLI"
ProductVersion = "0.1.0.0"
