[package]
name = "cuna-native-authority"
version = "0.1.0"
description = "Cuna Node-API authority for owned native process exchange"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.12.1", default-features = false, features = ["napi8"] }
napi-derive = { version = "=3.6.3", default-features = false, features = ["strict"] }
sha2 = "=0.10.9"
zeroize = "=1.9.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_IO",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "=0.2.177"

[build-dependencies]
napi-build = "=2.4.1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"
